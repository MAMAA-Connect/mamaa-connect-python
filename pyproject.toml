[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mamaa-connect"
version = "0.1.0"
description = "Unified AI and Cloud interoperability SDK for Big Tech ecosystems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "boto3>=1.34.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "cloudevents>=1.10.0"
]
